# config.example.yaml - 复制为 config.yaml 并填入真实值

ai:
  providers:
    deepseek:
      baseUrl: https://api.deepseek.com/v1
      apiKey: ${DEEPSEEK_API_KEY}

    anthropic:
      apiKey: ${ANTHROPIC_API_KEY}

  tasks:
    filter:
      provider: deepseek
      model: deepseek-chat

    extractAndClassify:
      provider: anthropic
      model: claude-sonnet-4-20250514

sources:
  # RSS 示例
  - name: "Hacker News"
    type: rss
    enabled: true
    fetchInterval: 3600
    config:
      url: https://hnrss.org/frontpage

  # V2EX 示例
  - name: "V2EX 热门"
    type: v2ex
    enabled: true
    fetchInterval: 3600
    config:
      node: hot

  # Twitter 示例
  - name: "Twitter 推荐"
    type: twitter
    enabled: false
    fetchInterval: 3600
    config:
      clientId: ${TWITTER_CLIENT_ID}
      clientSecret: ${TWITTER_CLIENT_SECRET}
      accessToken: ${TWITTER_ACCESS_TOKEN}
      refreshToken: ${TWITTER_REFRESH_TOKEN}
      mode: home
      maxResults: 50

filter:
  hardRules:
    enabled: true
    blacklistDomains:
      - "bit.ly/spam"
    spamKeywords:
      - "微信群"
      - "返利"
      - "优惠码"
      - "开户"
      - "代投"
      - "包赚"

  thresholds:
    passMinValueScore: 30
    rejectMaxValueScore: 15
    quarantineOnSafety: true

  promptVersion: "v1.0"
  quarantineTTLDays: 30

scheduler:
  timezone: Asia/Shanghai
